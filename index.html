<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Recycling Meter 2026 — Cumulative Animation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
    --metalla:#f59e0b; --gyali:#38bdf8; --pet:#22c55e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 20% 0%,#1e293b 0%,#0f172a 60%);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .wrap{width:min(1000px,100%)}
  h1{margin:0 0 4px;font-size:1.5rem;font-weight:600}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .card{
    background:var(--card);border-radius:14px;padding:14px 16px;
    border:1px solid #334155;position:relative;overflow:hidden;
  }
  .card .label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .card .value{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:6px}
  .card .bar{position:absolute;left:0;bottom:0;height:3px;width:0%;transition:width .2s linear}
  .card.m .bar{background:var(--metalla)} .card.m .value{color:var(--metalla)}
  .card.g .bar{background:var(--gyali)}   .card.g .value{color:var(--gyali)}
  .card.p .bar{background:var(--pet)}     .card.p .value{color:var(--pet)}

  .chart-box{background:var(--card);border:1px solid #334155;border-radius:14px;padding:18px}
  canvas{width:100%!important;height:420px!important}

  .controls{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  button{
    background:#334155;color:var(--text);border:0;border-radius:9px;
    padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:#475569}
  button:disabled{opacity:.45;cursor:not-allowed}
  input[type=range]{flex:1;min-width:200px;accent-color:#38bdf8}
  .month-tag{font-weight:700;color:#38bdf8;min-width:70px;text-align:right}
  .err{color:#f87171;font-size:.85rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>♻️ Recycling Meter — Cumulative 2026</h1>
  <p class="sub" id="subtitle">Φόρτωση δεδομένων…</p>

  <div class="cards">
    <div class="card m"><div class="label">Μέταλλα</div><div class="value" id="v-metalla">0</div><div class="bar" id="b-metalla"></div></div>
    <div class="card g"><div class="label">Γυαλί</div><div class="value" id="v-gyali">0</div><div class="bar" id="b-gyali"></div></div>
    <div class="card p"><div class="label">Pet</div><div class="value" id="v-pet">0</div><div class="bar" id="b-pet"></div></div>
  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="resetBtn">⟲ Reset</button>
    <input type="range" id="slider" min="0" max="0" value="0" step="1">
    <span class="month-tag" id="monthTag">—</span>
  </div>
  <div class="err" id="err"></div>
</div>

<script>
// ---------- Config ----------
const CSV_FILE = "recycle_meter.csv";
const COLORS = { metalla:"#f59e0b", gyali:"#38bdf8", pet:"#22c55e" };

// Map Greek month abbreviations -> index 0..11
const MONTHS = {
  "ιαν":0,"ιανουαρ":0,"jan":0,
  "φεβ":1,"φεβρουαρ":1,"feb":1,
  "μαρ":2,"μαρτι":2,"mar":2,
  "απρ":3,"απριλ":3,"apr":3,
  "μαϊ":4,"μαι":4,"μαη":4,"may":4,
  "ιουν":5,"ιουνι":5,"jun":5,
  "ιουλ":6,"ιουλι":6,"jul":6,
  "αυγ":7,"αυγουστ":7,"aug":7,
  "σεπ":8,"σεπτεμβρ":8,"sep":8,
  "οκτ":9,"οκτωβρ":9,"oct":9,
  "νοε":10,"νοεμβρ":10,"nov":10,
  "δεκ":11,"δεκεμβρ":11,"dec":11
};
const MONTH_LABELS = ["Ιαν","Φεβ","Μαρ","Απρ","Μαϊ","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];

// normalize greek (accent-insensitive) + lowercase
function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function parseNumber(v){
  return Number(String(v).replace(/[^\d.-]/g,"")) || 0;
}

// ---------- State ----------
let months = [];        // [{label, metalla, gyali, pet}]
let cumulative = [];    // running totals
let maxTotals = { metalla:1, gyali:1, pet:1 };
let chart, playing=false, idx=0, timer=null;

// ---------- Load CSV ----------
async function loadCSV(){
  let text;
  try{
    const res = await fetch(CSV_FILE, {cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    text = await res.text();
  }catch(e){
    document.getElementById("err").textContent =
      "⚠️ Δεν ήταν δυνατή η φόρτωση του " + CSV_FILE +
      " — βεβαιώσου ότι είναι στον ίδιο φάκελο και ότι σερβίρεις τη σελίδα μέσω http(s) (π.χ. python -m http.server), όχι file://";
    document.getElementById("subtitle").textContent = "Σφάλμα φόρτωσης.";
    return;
  }

  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(lines.length < 2){ showError("Το CSV δεν έχει αρκετές γραμμές."); return; }

  // detect delimiter
  const delim = lines[0].includes(";") ? ";" : ",";

  // header (first line) -> find material columns
  const header = lines[0].split(delim).map(s => s.trim());
  const headerNorm = header.map(norm);
  const iMonth  = 0;
  const iMet    = headerNorm.findIndex(h => h.includes("μεταλ") || h.includes("metall"));
  const iGya    = headerNorm.findIndex(h => h.includes("γυαλ") || h.includes("glass"));
  const iPet    = headerNorm.findIndex(h => h.includes("pet"));

  if(iMet<0 || iGya<0 || iPet<0){
    showError("Δεν βρέθηκαν οι στήλες Μέταλλα / Γυαλί / Pet στο header: " + header.join(" | "));
    return;
  }

  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cells = lines[i].split(delim);
    if(cells.length <= Math.max(iMet,iGya,iPet)) continue;
    const mLabel = cells[iMonth].trim();
    if(!mLabel) continue;
    rows.push({
      label: mLabel,
      metalla: parseNumber(cells[iMet]),
      gyali:   parseNumber(cells[iGya]),
      pet:     parseNumber(cells[iPet])
    });
  }

  // sort rows by month order
  rows.sort((a,b)=>{
    const ka = MONTHS[norm(a.label)] ?? 99;
    const kb = MONTHS[norm(b.label)] ?? 99;
    return ka - kb;
  });

  // build cumulative
  months = rows;
  cumulative = [];
  let cM=0,cG=0,cP=0;
  for(const r of rows){
    cM += r.metalla; cG += r.gyali; cP += r.pet;
    cumulative.push({ label:r.label, metalla:cM, gyali:cG, pet:cP });
  }

  // max per series (for progress bars)
  const last = cumulative[cumulative.length-1];
  maxTotals = { metalla:last.metalla, gyali:last.gyali, pet:last.pet };

  // UI
  document.getElementById("subtitle").textContent =
    `${rows.length} μήνες • Τελευταίος: ${last.label} • Σύνολο: ${(last.metalla+last.gyali+last.pet).toLocaleString("el-GR")}`;

  const slider = document.getElementById("slider");
  slider.max = cumulative.length;   // 0..N (0 = empty state)
  slider.value = 0;

  buildChart();
  render(0);
}

function showError(msg){
  document.getElementById("err").textContent = "⚠️ " + msg;
  document.getElementById("subtitle").textContent = "Σφάλμα.";
}

// ---------- Chart ----------
function buildChart(){
  const ctx = document.getElementById("chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: cumulative.map(c => c.label),
      datasets: [
        ds("Μέταλλα", "metalla", COLORS.metalla),
        ds("Γυαλί",   "gyali",   COLORS.gyali),
        ds("Pet",     "pet",     COLORS.pet)
      ]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      animation:{duration:250},
      interaction:{mode:"index", intersect:false},
      plugins:{
        legend:{ labels:{ color:"#e2e8f0", usePointStyle:true, boxWidth:8 } },
        tooltip:{
          callbacks:{
            label: c => ` ${c.dataset.label}: ${Math.round(c.parsed.y).toLocaleString("el-GR")}`
          }
        }
      },
      scales:{
        x:{ ticks:{ color:"#94a3b8" }, grid:{ color:"#334155" } },
        y:{
          beginAtZero:true,
          ticks:{ color:"#94a3b8", callback: v => Number(v).toLocaleString("el-GR") },
          grid:{ color:"#334155" }
        }
      }
    }
  });
}

function ds(label, key, color){
  return {
    label, key,
    data: cumulative.map(c => c[key]),
    borderColor: color,
    backgroundColor: color + "33",
    borderWidth: 3,
    pointRadius: 3,
    pointHoverRadius: 6,
    tension: 0.3,
    fill: true
  };
}

// ---------- Render frame at step (0..N) ----------
function render(step){
  idx = step;
  const N = cumulative.length;

  // Running totals up to step (0 = all zeros)
  const cur = step === 0
    ? { metalla:0, gyali:0, pet:0 }
    : cumulative[step-1];

  // Cards
  setCard("metalla", cur.metalla, maxTotals.metalla);
  setCard("gyali",   cur.gyali,   maxTotals.gyali);
  setCard("pet",     cur.pet,     maxTotals.pet);

  // Chart: reveal data progressively, keep line flat at current value for future points
  chart.data.datasets.forEach(d => {
    d.data = cumulative.map((c, i) => i < step ? c[d.key] : null);
  });
  chart.update("none");

  // Month tag
  document.getElementById("monthTag").textContent =
    step === 0 ? "—" : cumulative[step-1].label;

  // Slider
  document.getElementById("slider").value = step;
}

function setCard(key, value, max){
  const el   = document.getElementById("v-" + key);
  const bar  = document.getElementById("b-" + key);
  const shown = Math.round(value);
  el.textContent = shown.toLocaleString("el-GR");
  bar.style.width = (max ? (value / max) * 100 : 0) + "%";
}

// ---------- Playback ----------
function play(){
  if(playing) return;
  const N = cumulative.length;
  if(idx >= N){ idx = 0; render(0); }

  playing = true;
  document.getElementById("playBtn").disabled = true;

  timer = setInterval(() => {
    if(idx >= N){
      stop();
      return;
    }
    render(idx + 1);
    if(idx >= N) stop();
  }, 700);   // ms per month — change to taste
}

function stop(){
  playing = false;
  clearInterval(timer);
  document.getElementById("playBtn").disabled = false;
  document.getElementById("playBtn").textContent = "▶ Play";
}

// ---------- Wire up ----------
document.getElementById("playBtn").addEventListener("click", ()=>{
  if(playing){ stop(); }
  else { document.getElementById("playBtn").textContent = "⏸ Pause"; play(); }
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  stop();
  document.getElementById("playBtn").textContent = "▶ Play";
  render(0);
});
document.getElementById("slider").addEventListener("input", e=>{
  stop();
  document.getElementById("playBtn").textContent = "▶ Play";
  render(Number(e.target.value));
});

loadCSV();
</script>
</body>
</html>
