<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♻️ 2026 Recycling Progress</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: 0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .card {
    width: min(1100px, 100%);
    background: var(--panel);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #chart { width: 100%; height: 700px; }
  footer { margin-top: 20px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>♻️ 2026 Recycling Progress</h1>
  <p>Monthly collection of metal, glass and PET</p>
</header>

<div class="card">
  <div id="chart"></div>
</div>

<footer>Press ▶ Play or drag the slider to explore each month.</footer>

<!-- ============================================================
     Plotly.js embedded locally so the page works fully offline.
     Loaded from CDN; on first open the browser caches it.
     If you want a TRULY zero-internet version, see notes below.
     ============================================================ -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<script>
// ===============================================================
// 1. CSV DATA — paste the contents of recycle_meter.csv here.
//    Keep the header line exactly as: month,metal,glass,pet
// ===============================================================
const csvData = `month,metal,glass,pet
2026-01,120,80,200
2026-02,145,95,230
2026-03,180,110,270
2026-04,210,140,310
2026-05,260,175,360
2026-06,300,210,400
2026-07,340,240,450
2026-08,380,270,490
2026-09,420,300,540
2026-10,460,330,590
2026-11,500,360,640
2026-12,550,400,700`;

// ===============================================================
// 2. Config
// ===============================================================
const MATERIALS = ['metal', 'glass', 'pet'];
const COLOR_MAP = {
  metal: '#94a3b8',
  glass: '#34d399',
  pet:   '#60a5fa'
};

// ===============================================================
// 3. Helpers
// ===============================================================
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cells = line.split(',').map(c => c.trim());
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i]);
    return row;
  });
}

function formatMonth(m) {
  const match = /^(\d{4})-(\d{1,2})$/.exec(m);
  if (!match) return m;
  const names = ['Jan','Feb','Mar','Apr','May','Jun',
                 'Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[parseInt(match[2],10)-1]} ${match[1]}`;
}

// ===============================================================
// 4. Build the chart
// ===============================================================
function buildChart(rows) {
  const monthLabels = rows.map(r => formatMonth(r.month));
  const maxVal = Math.max(
    ...rows.flatMap(r => MATERIALS.map(m => +r[m] || 0))
  );

  // One frame per month, three horizontal bars per frame
  const frames = rows.map((r, i) => ({
    name: monthLabels[i],
    data: MATERIALS.map(mat => ({
      type: 'bar',
      orientation: 'h',
      name: mat.toUpperCase(),
      y: [monthLabels[i]],
      x: [+r[mat] || 0],
      marker: { color: COLOR_MAP[mat] },
      text: [`${+r[mat] || 0} kg`],
      textposition: 'outside',
      cliponaxis: false,
      hovertemplate:
        `<b>${mat.toUpperCase()}</b><br>${monthLabels[i]}: %{x} kg<extra></extra>`
    })),
    layout: {
      title: { text: `♻️ Recycling — ${monthLabels[i]}` }
    }
  }));

  const layout = {
    title: {
      text: `♻️ Recycling — ${monthLabels[0]}`,
      font: { size: 22, color: '#e2e8f0' },
      x: 0.5
    },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#e2e8f0', family: 'Segoe UI, Arial' },
    barmode: 'group',
    bargap: 0.4,
    bargroupgap: 0.1,
    xaxis: {
      title: 'Amount collected (kg)',
      gridcolor: 'rgba(148,163,184,0.15)',
      zerolinecolor: 'rgba(148,163,184,0.3)',
      range: [0, maxVal * 1.2]
    },
    yaxis: {
      title: 'Month',
      gridcolor: 'rgba(148,163,184,0.08)',
      type: 'category'
    },
    legend: {
      orientation: 'h',
      y: 1.1, x: 0.5, xanchor: 'center'
    },
    margin: { l: 100, r: 60, t: 100, b: 90 },
    height: 700,
    updatemenus: [{
      type: 'buttons',
      direction: 'left',
      x: 0.02, y: 1.16,
      showactive: false,
      buttons: [
        {
          label: '▶ Play',
          method: 'animate',
          args: [null, {
            frame: { duration: 800, redraw: true },
            fromcurrent: true,
            transition: { duration: 400, easing: 'cubic-in-out' }
          }]
        },
        {
          label: '⏸ Pause',
          method: 'animate',
          args: [[null], {
            frame: { duration: 0, redraw: true },
            mode: 'immediate',
            transition: { duration: 0 }
          }]
        }
      ]
    }],
    sliders: [{
      active: 0,
      x: 0.1, len: 0.85, y: -0.02,
      currentvalue: {
        prefix: 'Month: ',
        font: { size: 14, color: '#e2e8f0' }
      },
      font: { color: '#e2e8f0' },
      steps: monthLabels.map(label => ({
        label,
        method: 'animate',
        args: [[label], {
          mode: 'immediate',
          frame: { duration: 500, redraw: true },
          transition: { duration: 300 }
        }]
      }))
    }]
  };

  Plotly.newPlot('chart', frames[0].data, layout, {
    responsive: true,
    displayModeBar: true,
    displaylogo: false
  }).then(() => {
    Plotly.addFrames('chart', frames);
  });
}

// ===============================================================
// 5. Run
// ===============================================================
buildChart(parseCSV(csvData));
</script>
</body>
</html>
