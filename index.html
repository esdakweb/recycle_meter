<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♻️ Πρόοδος Ανακύκλωσης 2026</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: 0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .card {
    width: min(1100px, 100%);
    background: var(--panel);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #chart { width: 100%; height: 700px; }
  footer { margin-top: 20px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>♻️ Πρόοδος Ανακύκλωσης 2026</h1>
  <p>Σωρευτική συλλογή μετάλλου, γυαλιού και PET</p>
</header>

<div class="card">
  <div id="chart"></div>
</div>

<footer>Πατήστε ▶ Play ή σύρετε το slider για να δείτε κάθε μήνα.</footer>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<script>
// ===============================================================
// 1. CSV DATA — add new months at the bottom as the year goes on.
//    Each row is that month's NEW amount; the script accumulates.
// ===============================================================
const csvData = `month,metal,glass,pet
Ιαν,304383,59630,1627714
Φεβ,314742,66614,1727514
Μαρ,355178,61085,1941433
Απρ,384146,66138,1895017
Μαϊ,450766,75206,2128548
Ιουν,553685,97181,2339078
Ιουλ,324610,29950,1322827
Αυγ,11513,2551,65289`;

// ===============================================================
// 2. Config
// ===============================================================
const MATERIALS = ['metal', 'glass', 'pet'];
const COLOR_MAP = {
  metal: '#94a3b8',
  glass: '#34d399',
  pet:   '#60a5fa'
};
const MATERIAL_LABELS = {
  metal: 'Μέταλλο',
  glass: 'Γυαλί',
  pet:   'PET'
};

// ===============================================================
// 3. Helpers
// ===============================================================
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cells = line.split(',').map(c => c.trim());
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i]);
    return row;
  });
}

function formatNumber(n) {
  return new Intl.NumberFormat('el-GR').format(n);
}

// ===============================================================
// 4. Build the chart with CUMULATIVE totals per frame
// ===============================================================
function buildChart(rows) {
  const monthLabels = rows.map(r => r.month);

  // --- Accumulate: monthly frame shows running total up to that month
  const cumulative = [];
  const running = { metal: 0, glass: 0, pet: 0 };
  rows.forEach(r => {
    MATERIALS.forEach(m => running[m] += (+r[m] || 0));
    cumulative.push({ month: r.month, ...running });
  });

  const maxVal = Math.max(
    ...cumulative.flatMap(r => MATERIALS.map(m => +r[m] || 0))
  );

  // --- One frame per month — three horizontal bars (running totals)
  const frames = cumulative.map((r, i) => ({
    name: monthLabels[i],
    data: MATERIALS.map(mat => ({
      type: 'bar',
      orientation: 'h',
      name: MATERIAL_LABELS[mat],
      y: [monthLabels[i]],
      x: [+r[mat] || 0],
      marker: { color: COLOR_MAP[mat] },
      text: [formatNumber(+r[mat] || 0)],
      textposition: 'outside',
      cliponaxis: false,
      hovertemplate:
        `<b>${MATERIAL_LABELS[mat]}</b><br>` +
        `Έως ${monthLabels[i]} 2026: %{x:,} kg<extra></extra>`
    })),
    layout: {
      title: { text: `♻️ Σύνολο έως ${monthLabels[i]} 2026` }
    }
  }));

  const layout = {
    title: {
      text: `♻️ Σύνολο έως ${monthLabels[0]} 2026`,
      font: { size: 22, color: '#e2e8f0' },
      x: 0.5
    },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#e2e8f0', family: 'Segoe UI, Arial' },
    barmode: 'group',
    bargap: 0.45,
    bargroupgap: 0.12,
    xaxis: {
      title: 'Σωρευτική ποσότητα (kg)',
      gridcolor: 'rgba(148,163,184,0.15)',
      zerolinecolor: 'rgba(148,163,184,0.3)',
      range: [0, maxVal * 1.25],
      tickformat: ',.0f',
      separatethousands: true
    },
    yaxis: {
      title: 'Μήνας',
      gridcolor: 'rgba(148,163,184,0.08)',
      type: 'category'
    },
    legend: {
      orientation: 'h',
      y: 1.1, x: 0.5, xanchor: 'center',
      font: { size: 13 }
    },
    margin: { l: 100, r: 90, t: 110, b: 100 },
    height: 700,
    updatemenus: [{
      type: 'buttons',
      direction: 'left',
      x: 0.02, y: 1.16,
      showactive: false,
      buttons: [
        {
          label: '▶ Play',
          method: 'animate',
          args: [null, {
            frame: { duration: 900, redraw: true },
            fromcurrent: true,
            transition: { duration: 400, easing: 'cubic-in-out' }
          }]
        },
        {
          label: '⏸ Pause',
          method: 'animate',
          args: [[null], {
            frame: { duration: 0, redraw: true },
            mode: 'immediate',
            transition: { duration: 0 }
          }]
        }
      ]
    }],
    sliders: [{
      active: 0,
      x: 0.1, len: 0.85, y: -0.02,
      currentvalue: {
        prefix: 'Μήνας: ',
        font: { size: 14, color: '#e2e8f0' }
      },
      font: { color: '#e2e8f0' },
      steps: monthLabels.map(label => ({
        label,
        method: 'animate',
        args: [[label], {
          mode: 'immediate',
          frame: { duration: 500, redraw: true },
          transition: { duration: 300 }
        }]
      }))
    }]
  };

  Plotly.newPlot('chart', frames[0].data, layout, {
    responsive: true,
    displayModeBar: true,
    displaylogo: false
  }).then(() => {
    Plotly.addFrames('chart', frames);
  });
}

// ===============================================================
// 5. Run
// ===============================================================
buildChart(parseCSV(csvData));
</script>
</body>
</html>
