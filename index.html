<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♻️ 2026 Recycling Progress</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: 0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .card {
    width: min(1100px, 100%);
    background: var(--panel);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  #chart { width: 100%; height: 700px; }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 20px;
  }
  footer { margin-top: 20px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>♻️ 2026 Recycling Progress</h1>
  <p>Monthly collection of metal, glass and PET</p>
</header>

<div class="card">
  <div id="chart"></div>
  <div id="status">Loading recycle_meter.csv…</div>
</div>

<footer>Press ▶ Play or drag the slider to explore each month.</footer>

<script>
// ---------------------------------------------------------------
// Config
// ---------------------------------------------------------------
const CSV_FILE = 'recycle_meter.csv';
const MATERIALS = ['metal', 'glass', 'pet'];
const COLOR_MAP = {
  metal: '#94a3b8',
  glass: '#34d399',
  pet:   '#60a5fa'
};

// ---------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cells = line.split(',').map(c => c.trim());
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i]);
    return row;
  });
}

function formatMonth(m) {
  // "2026-01" -> "Jan 2026"; falls back to raw string if not matching
  const match = /^(\d{4})-(\d{1,2})$/.exec(m);
  if (!match) return m;
  const names = ['Jan','Feb','Mar','Apr','May','Jun',
                 'Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[parseInt(match[2],10)-1]} ${match[1]}`;
}

// ---------------------------------------------------------------
// Build chart
// ---------------------------------------------------------------
function buildChart(rows) {
  if (!rows.length) {
    document.getElementById('status').textContent =
      'CSV file is empty.';
    return;
  }

  const monthLabels = rows.map(r => formatMonth(r.month));
  const maxVal = Math.max(
    ...rows.flatMap(r => MATERIALS.map(m => +r[m] || 0))
  );

  // --- One frame per month: 3 horizontal bars (one per material) ---
  const frames = rows.map((r, i) => ({
    name: monthLabels[i],
    data: MATERIALS.map(mat => ({
      type: 'bar',
      orientation: 'h',
      name: mat.toUpperCase(),
      y: [monthLabels[i]],            // month on Y
      x: [+r[mat] || 0],              // value on X
      marker: { color: COLOR_MAP[mat] },
      text: [`${+r[mat] || 0} kg`],
      textposition: 'outside',
      cliponaxis: false,
      hovertemplate:
        `<b>${mat.toUpperCase()}</b><br>${monthLabels[i]}: %{x} kg<extra></extra>`
    })),
    layout: {
      title: { text: `♻️ Recycling — ${monthLabels[i]}` }
    }
  }));

  const layout = {
    title: {
      text: `♻️ Recycling — ${monthLabels[0]}`,
      font: { size: 22, color: '#e2e8f0' },
      x: 0.5
    },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#e2e8f0', family: 'Segoe UI, Arial' },
    barmode: 'group',
    bargap: 0.4,
    bargroupgap: 0.1,
    xaxis: {
      title: 'Amount collected (kg)',
      gridcolor: 'rgba(148,163,184,0.15)',
      zerolinecolor: 'rgba(148,163,184,0.3)',
      range: [0, maxVal * 1.2]
    },
    yaxis: {
      title: 'Month',
      gridcolor: 'rgba(148,163,184,0.08)',
      // Only one category visible per frame, but keep the axis tidy:
      type: 'category'
    },
    legend: {
      orientation: 'h',
      y: 1.1, x: 0.5, xanchor: 'center'
    },
    margin: { l: 100, r: 60, t: 100, b: 90 },
    height: 700,
    updatemenus: [{
      type: 'buttons',
      direction: 'left',
      x: 0.02, y: 1.16,
      showactive: false,
      buttons: [
        {
          label: '▶ Play',
          method: 'animate',
          args: [null, {
            frame: { duration: 800, redraw: true },
            fromcurrent: true,
            transition: { duration: 400, easing: 'cubic-in-out' }
          }]
        },
        {
          label: '⏸ Pause',
          method: 'animate',
          args: [[null], {
            frame: { duration: 0, redraw: true },
            mode: 'immediate',
            transition: { duration: 0 }
          }]
        }
      ]
    }],
    sliders: [{
      active: 0,
      x: 0.1, len: 0.85, y: -0.02,
      currentvalue: {
        prefix: 'Month: ',
        font: { size: 14, color: '#e2e8f0' }
      },
      font: { color: '#e2e8f0' },
      steps: monthLabels.map((label, i) => ({
        label,
        method: 'animate',
        args: [[label], {
          mode: 'immediate',
          frame: { duration: 500, redraw: true },
          transition: { duration: 300 }
        }]
      }))
    }]
  };

  // Initial trace data = first frame
  const initialData = frames[0].data;

  Plotly.newPlot('chart', initialData, layout, {
    responsive: true,
    displayModeBar: true,
    displaylogo: false
  }).then(() => {
    Plotly.addFrames('chart', frames);
    document.getElementById('status').style.display = 'none';
  });
}

// ---------------------------------------------------------------
// Load CSV then build
// ---------------------------------------------------------------
fetch(CSV_FILE)
  .then(resp => {
    if (!resp.ok) throw new Error(`HTTP ${resp.status} — ${resp.statusText}`);
    return resp.text();
  })
  .then(text => buildChart(parseCSV(text)))
  .catch(err => {
    document.getElementById('status').innerHTML =
      `⚠️ Could not load <code>${CSV_FILE}</code>: ${err.message}<br>` +
      `Make sure the CSV file is in the same folder and that you're ` +
      `serving the page over <strong>http://</strong> (not file://).`;
    console.error(err);
  });
</script>
</body>
</html>
